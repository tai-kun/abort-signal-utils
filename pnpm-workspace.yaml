packages: ["packages/abort-signal-utils", "website"]

minimumReleaseAge: 10080 # 7 日
minimumReleaseAgeExclude: []

blockExoticSubdeps: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - "@pierre/theme"
  - "@vercel/*"
  - "chokidar"
  - "semver"
  - "undici-types"

strictDepBuilds: true
onlyBuiltDependencies: []
allowBuilds:
  esbuild: true

update:
  ignoreDeps:
    - "*" # パッケージの更新は ncu に任せます。

overrides: {}
